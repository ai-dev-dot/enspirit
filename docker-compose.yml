services:
  app:
    image: ghcr.io/ai-dev-dot/enspirit:latest
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://enspirit:${DB_PASSWORD}@db:5432/enspirit
      - AUTH_SECRET=${AUTH_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=enspirit
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=enspirit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enspirit"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
